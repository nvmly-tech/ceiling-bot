[project]
name = "ceiling-bot"
version = "0.1.0"
description = "TG-бот первичного контакта для студии натяжных потолков"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.coverage.run]
source = ["app", "deploy"]
branch = true
# Сервис GigaAM работает в своём окружении (gigaam, torch) — его проверяет install.sh на сервере.
omit = ["deploy/stt/*"]

[tool.coverage.report]
# Покрытие не должно проседать незаметно: deploy.sh не выложит версию ниже порога.
fail_under = 93
skip_covered = true
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
