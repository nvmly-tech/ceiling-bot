# Обновления зависимостей бота (uv.lock) и действий GitHub в CI — раз в неделю, pull request'ами:
# CI прогонит на них линтер и тесты.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
